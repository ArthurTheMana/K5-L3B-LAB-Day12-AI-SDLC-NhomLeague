<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hc-btn, #home-btn { position: fixed; top: 10px; z-index: 10; padding: 5px 10px; border-radius: 6px; border: 2px solid #9fb3c0; background: #18222c; color: #fff; font: 700 12px/1.2 system-ui, sans-serif; cursor: pointer; }
  #hc-btn { right: 12px; }
  #home-btn { right: 168px; }
  #hc-btn.active { border-color: #ffe600; background: #000; color: #ffe600; }
  #home-menu { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 25%, #2b3c46, #0d1821 75%); padding: 24px; text-align: center; }
  #home-menu.hidden { display: none; }
  #home-menu h1 { margin: 0 0 6px; font-size: 36px; color: #ffe082; text-shadow: 0 3px 12px rgba(0,0,0,.6); }
  #home-menu p.sub { margin: 0 0 28px; color: #b8ccd8; font-size: 15px; }
  .menu-grid { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; max-width: 860px; }
  .menu-card { width: 245px; padding: 20px 18px; border-radius: 14px; border: 2px solid #496778; background: rgba(20,34,44,.92); color: #fff; cursor: pointer; text-align: left; transition: transform .15s, border-color .15s; }
  .menu-card:hover { transform: translateY(-4px); border-color: #ffe082; }
  .menu-card .title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: #ffd54f; }
  .menu-card .desc { font-size: 13px; color: #cfd8dc; line-height: 1.45; }
</style>
</head>
<body>
<button id="home-btn" type="button">🏠 Trang chủ</button>
<button id="hc-btn" type="button" title="Phím tắt: H">Tương phản cao (H)</button>
<div id="home-menu">
  <h1>🛶 QUÁN ĂN CHỢ NỔI — RẠCH SEN</h1>
  <p class="sub">Chọn chế độ chơi để bắt đầu</p>
  <div class="menu-grid">
    <button class="menu-card" type="button" data-mode="gather">
      <div class="title">🌊 Bắt Cá &amp; Hái Rau</div>
      <div class="desc">Lặn sông Chín Khúc lúc bình minh, bắt cá linh, cá lóc, cá kèo, hái bông điên điển và tránh Cá Sấu Năm Chèo.</div>
    </button>
    <button class="menu-card" type="button" data-mode="quan">
      <div class="title">🍲 Mở Quán Chợ Nổi</div>
      <div class="desc">Phục vụ ngay 4 bàn T1–T4 đông khách trên nhà bè với 2 bếp B1–B2, nấu 6 món đặc sản miền Tây.</div>
    </button>
    <button class="menu-card" type="button" data-mode="day">
      <div class="title">☀️ Chơi Trọn Vòng Ngày</div>
      <div class="desc">Trải nghiệm đầy đủ 5 ngày: Sáng lặn bắt cá → Tối mở quán bán hàng → Mua nâng cấp tại Shop.</div>
    </button>
  </div>
</div>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const hcBtn = document.getElementById("hc-btn");
const homeBtn = document.getElementById("home-btn");
const homeMenu = document.getElementById("home-menu");
let snap = null, offline = false, highContrast = false;
let audioContext = null, dangerActive = false;

function toggleHighContrast() {
  highContrast = !highContrast;
  hcBtn.classList.toggle("active", highContrast);
  hcBtn.textContent = highContrast ? "Tương phản cao: BẬT (H)" : "Tương phản cao (H)";
  hcBtn.blur();
}
hcBtn.addEventListener("click", toggleHighContrast);
homeBtn.addEventListener("click", () => { homeMenu.classList.remove("hidden"); down.clear(); homeBtn.blur(); });
document.querySelectorAll(".menu-card[data-mode]").forEach((btn) => {
  btn.addEventListener("click", async () => {
    btn.blur();
    const mode = btn.getAttribute("data-mode");
    try {
      const r = await fetch("/switch_mode", { method: "POST", body: JSON.stringify({ mode }), headers: { "Content-Type": "application/json" } });
      if (r.ok) {
        const sr = await fetch("/state", { cache: "no-store" });
        if (sr.ok) snap = await sr.json();
        lastSent = ""; down.clear();
        homeMenu.classList.add("hidden");
      }
    } catch (e) {}
  });
});

function dangerSound() {
  if (!audioContext || audioContext.state !== "running") return;
  const oscillator = audioContext.createOscillator(), volume = audioContext.createGain();
  oscillator.type = "sine";
  oscillator.frequency.value = 330;
  volume.gain.setValueAtTime(0.04, audioContext.currentTime);
  volume.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.25);
  oscillator.connect(volume);
  volume.connect(audioContext.destination);
  oscillator.start();
  oscillator.stop(audioContext.currentTime + 0.25);
}


// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? (snap.mode === "day" ? snap.phase : snap.mode) : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  // STAMINA LIVE ONLY: button omitted entirely for Quan mode.
  return {
    move: [dx, dy],
    interact: down.has("interact"),
    catch: down.has("catch"),
    pause: down.has("pause"),
    shop_done: down.has("shop_done"),
    menu: down.has("menu"),
    quit: down.has("quit"),
    ...(mode === "gather" ? { sprint: down.has("sprint") } : {})
  };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  if (!audioContext && (window.AudioContext || window.webkitAudioContext)) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioContext && audioContext.state === "suspended") audioContext.resume().catch(() => {});
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "shift") { down.add("sprint"); e.preventDefault(); }
  else if (k === "p" || k === "escape") { down.add("pause"); e.preventDefault(); }
  else if (k === "enter") { down.add("shop_done"); e.preventDefault(); }
  else if (k === "m") down.add("menu");
  else if (k === "q") down.add("quit");
  else if ((k === "1" || k === "2") && snap?.mode === "day" && snap.phase === "shop") {
    queue.push(JSON.stringify({buy: k === "1" ? "oxygen" : "hp"})); flush();
  }
  else if (k === "h") { toggleHighContrast(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  else if (k === "shift") down.delete("sprint");
  else if (k === "p" || k === "escape") down.delete("pause");
  else if (k === "enter") down.delete("shop_done");
  else if (k === "m") down.delete("menu");
  else if (k === "q") down.delete("quit");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    const danger = (snap.monsters || []).some((m) => m.state === "chase");
    if (danger && !dangerActive) dangerSound();
    dangerActive = danger;
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh", canh_chua_ca_loc: "Canh chua", ca_keo_nuong: "Cá kèo nướng", lau_mam: "Lẩu mắm" };
const dn = (d) => DISH_NAME[d] || d;
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

// Tải sprite 2D vẽ tay & tách nền trắng thành trong suốt
const SPRITES = {};
function makeTransparent(img) {
  const c = document.createElement("canvas");
  c.width = img.naturalWidth || img.width;
  c.height = img.naturalHeight || img.height;
  const g = c.getContext("2d");
  g.drawImage(img, 0, 0);
  const id = g.getImageData(0, 0, c.width, c.height);
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i] > 235 && d[i + 1] > 235 && d[i + 2] > 235) d[i + 3] = 0;
  }
  g.putImageData(id, 0, 0);
  return c;
}
[
  ["ut_sen", "/assets/ut_sen_dive.png", true],
  ["ut_sen_quan", "/assets/ut_sen_quan.png", true],
  ["customer_quan", "/assets/customer_quan.png", true],
  ["ca_loc", "/assets/fish_ca_loc.png", true],
  ["ca_linh", "/assets/fish_ca_linh.png", true],
  ["ca_keo", "/assets/fish_ca_keo.png", true],
  ["croc", "/assets/croc.png", true],
  ["quan_bg", "/assets/quan_bg.png", false],
].forEach(([key, src, stripBg]) => {
  const img = new Image();
  img.onload = () => { SPRITES[key] = stripBg ? makeTransparent(img) : img; };
  img.src = src;
});

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" }));
}
function alertBanner(w, msg, bg, border, fg, y) {
  const bw = Math.min(w - 40, 440), x = (w - bw) / 2;
  ctx.fillStyle = highContrast ? "#000000" : bg;
  ctx.fillRect(x, y, bw, 28);
  ctx.strokeStyle = highContrast ? "#ffe600" : border;
  ctx.lineWidth = highContrast ? 3 : 2;
  ctx.strokeRect(x, y, bw, 28);
  text(msg, w / 2, y + 19, { size: 14, align: "center", color: highContrast ? "#ffe600" : fg });
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.state === "paused") {
    ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.fillRect(0, 0, w, h);
    text("Tạm dừng — P/Esc: tiếp tục" + (snap.mode === "day" ? " · M: về menu" : ""), w / 2, h / 2, { align: "center", size: 24 });
  }
  if (snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 190, h / 2 - 50, 380, 100);
    if (snap.mode === "day") {
      const sales = Object.entries(snap.sales_total || {}).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      text(`Tổng kết: ${snap.money}k · ${snap.score} điểm · Uy tín ${snap.reputation.toFixed(1)}`,
           w / 2, h / 2 - 18, { align: "center", size: 20 });
      text(`Món bán chạy: ${sales.length ? sales[0][0] + " × " + sales[0][1] : "chưa bán"}`,
           w / 2, h / 2 + 10, { align: "center", size: 18 });
    } else {
      text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20 });
    }
    text("Nhấn R để chơi lại", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 64, bottom = 56;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời ánh hồng buổi sớm + bờ dừa nước + nước phù sa
  if (highContrast) {
    ctx.fillStyle = "#080c10"; ctx.fillRect(0, top, w, SKY * s);
    ctx.fillStyle = "#001424"; ctx.fillRect(sx(0), oy, X * s, D * s);
  } else {
    const skyG = ctx.createLinearGradient(0, top, 0, oy);
    skyG.addColorStop(0, "#f5a58d"); skyG.addColorStop(0.55, "#fde1b4"); skyG.addColorStop(1, "#d9eff2");
    ctx.fillStyle = skyG; ctx.fillRect(0, top, w, SKY * s);
    // Mặt trời sớm
    ctx.fillStyle = "rgba(255,214,130,.75)";
    ctx.beginPath(); ctx.arc(sx(84), oy - 2.6 * s, 1.9 * s, 0, Math.PI * 2); ctx.fill();
    // Bờ dừa nước & nhà sàn xa
    for (let px = 10; px < X; px += 14) {
      const sway = Math.sin((snap.tick || 0) * 0.03 + px) * 0.15 * s;
      ctx.strokeStyle = "#356834"; ctx.lineWidth = 2;
      for (let k = -2; k <= 2; k++) {
        ctx.beginPath(); ctx.moveTo(sx(px), oy);
        ctx.quadraticCurveTo(sx(px) + k * 0.6 * s + sway, oy - 1.8 * s, sx(px) + k * 1.1 * s + sway, oy - 0.9 * s);
        ctx.stroke();
      }
    }
    const g = ctx.createLinearGradient(0, oy, 0, sy(D));
    g.addColorStop(0, "#7c7d55"); g.addColorStop(0.35, "#3a6b6e"); g.addColorStop(1, "#081c2c");
    ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  }
  // Sóng mặt nước
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath();
  for (let wx = 0; wx <= X; wx += 2) {
    const wy = oy + Math.sin(wx * 0.4 + (snap.tick || 0) * 0.08) * 1.8;
    if (wx === 0) ctx.moveTo(sx(wx), wy); else ctx.lineTo(sx(wx), wy);
  }
  ctx.stroke();
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.4)" });
  }
  // bến ghe nhà sàn mái lá
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#5d4028"; ctx.fillRect(sx(dp[0] - 1.7), sy(-0.15), 0.3 * s, 0.8 * s); ctx.fillRect(sx(dp[0] + 1.4), sy(-0.15), 0.3 * s, 0.8 * s);
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 2.0), sy(-0.7), 4.0 * s, 0.65 * s);
  ctx.fillStyle = "#b5693d"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 2.3), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.5)); ctx.lineTo(sx(dp[0] + 2.3), sy(-0.7)); ctx.fill();
  ctx.fillStyle = "#ffd54f"; ctx.beginPath(); ctx.arc(sx(dp[0] + 1.3), sy(-0.5), 0.22 * s, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến Chợ Nổi (E)", sx(dp[0]), sy(-2.85), { size: 11, align: "center", color: highContrast ? "#ffe600" : "#5a3a22" });
  // nút hái: điên điển (hoa vàng), bông súng (sen hồng), kèo nèo (lá xanh)
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    const nx = sx(n.pos[0]), ny = sy(n.pos[1]);
    ctx.globalAlpha = ready ? 1 : 0.3;
    ctx.fillStyle = "#2e7d32"; ctx.beginPath(); ctx.ellipse(nx, ny, 0.95 * s, 0.25 * s, 0, 0, Math.PI * 2); ctx.fill();
    if (n.kind === "bong_dien_dien") {
      ctx.fillStyle = "#fdd835";
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(nx + i * 0.35 * s, ny - 0.35 * s - (i === 0 ? 0.2 * s : 0), 0.26 * s, 0, Math.PI * 2); ctx.fill(); }
    } else if (n.kind === "bong_sung") {
      ctx.fillStyle = "#f06292"; ctx.beginPath(); ctx.arc(nx, ny - 0.3 * s, 0.38 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffeb3b"; ctx.beginPath(); ctx.arc(nx, ny - 0.3 * s, 0.14 * s, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = "#8bc34a";
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.ellipse(nx + i * 0.3 * s, ny - 0.35 * s, 0.18 * s, 0.35 * s, i * 0.3, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    text(n.id, nx, ny - 0.85 * s, { size: 10, align: "center", color: highContrast ? "#fff" : "#234" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", nx, ny + 1.1 * s, { size: 10, align: "center", color: "#fff" });
  });
  // đàn cá (dùng sprite vẽ tay nếu đã tải xong)
  (snap.fish || []).forEach((f, idx) => {
    const bob = Math.sin((snap.tick || 0) * 0.15 + idx) * 0.08 * s;
    const deg = ((f.heading_deg || 0) % 360 + 360) % 360;
    const flipX = deg > 90 && deg < 270;
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1]) + bob);
    if (flipX) ctx.scale(-1, 1);
    const sp = SPRITES[f.kind];
    if (sp) {
      ctx.drawImage(sp, -1.6 * s, -0.95 * s, 3.2 * s, 1.9 * s);
    } else {
      const wag = Math.sin((snap.tick || 0) * 0.2 + idx) * 0.2;
      ctx.fillStyle = kc(f.kind);
      ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.42 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-0.75 * s, 0); ctx.lineTo(-1.35 * s, (-0.42 + wag) * s); ctx.lineTo(-1.35 * s, (0.42 + wag) * s); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.95 * s, { size: 10, align: "center", color: "rgba(255,255,255,.85)" });
  });
  // thủy quái (Cá Sấu Năm Chèo)
  let monsterNear = false;
  (snap.monsters || []).forEach((m) => {
    const mx = sx(m.pos[0]), my = sy(m.pos[1]);
    const dist = snap.player ? Math.hypot(m.pos[0] - snap.player.pos[0], m.pos[1] - snap.player.pos[1]) : 999;
    if (m.state === "chase" || dist <= 10) monsterNear = true;
    if (m.state === "chase") {
      ctx.strokeStyle = "rgba(255,50,80,.75)"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(mx, my, (2.2 + (snap.tick % 60) / 60) * s, 1.2 * s, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (SPRITES.croc) {
      ctx.save(); ctx.translate(mx, my);
      if (snap.player && snap.player.pos[0] < m.pos[0]) ctx.scale(-1, 1);
      ctx.drawImage(SPRITES.croc, -2.2 * s, -1.2 * s, 4.4 * s, 2.4 * s);
      ctx.restore();
    } else {
      ctx.fillStyle = m.state === "chase" ? "#c62828" : "#4a6b3b";
      ctx.beginPath(); ctx.ellipse(mx, my, 1.45 * s, 0.55 * s, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (highContrast) { ctx.strokeStyle = "#ffe600"; ctx.lineWidth = 2.5; ctx.strokeRect(mx - 2.0 * s, my - 1.0 * s, 4 * s, 2.0 * s); }
    text("🐊 " + m.id, mx, my - 1.25 * s, { size: 11, align: "center", color: "#fff" });
  });
  // Út Sen (sprite vẽ tay)
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = highContrast ? "#ffe600" : "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = highContrast ? "#ffe600" : "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      const deg = ((p.heading_deg || 0) % 360 + 360) % 360;
      const flipX = deg > 90 && deg < 270;
      if (SPRITES.ut_sen) {
        ctx.save(); ctx.translate(px, py);
        if (flipX) ctx.scale(-1, 1);
        ctx.drawImage(SPRITES.ut_sen, -1.7 * s, -1.1 * s, 3.4 * s, 2.2 * s);
        ctx.restore();
      } else {
        ctx.fillStyle = "#b85d43"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      }
      if (highContrast) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(px, py, 1.1 * s, 0, Math.PI * 2); ctx.stroke(); }
    }
  }
  // HUD trên
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28,
       { size: 20, color: snap.time_left_ticks <= 30 * 60 ? "#ff5252" : "#e8eef2" });
  
  // Oxygen percentage + Cảnh báo Oxy < 20%
  let oxyLow = false;
  if (p && p.oxygen_max_ticks) {
    const oxygenPercent = Math.max(
      0,
      Math.min(100, (p.oxygen_ticks / p.oxygen_max_ticks) * 100)
    );
    oxyLow = oxygenPercent < 20;
    const oxyBlink = oxyLow && Math.floor(snap.tick / 10) % 2 === 0;
    bar(
      110, 12, 220, 18,
      oxygenPercent / 100,
      oxyLow ? (oxyBlink ? "#ff1744" : "#ffe600") : (oxygenPercent < 25 ? "#ef5350" : "#4fc3f7"),
      `${oxyLow ? "⚠ " : ""}Oxygen ${Math.ceil(oxygenPercent)}%`
    );
  }
  let alertY = 62;
  if (monsterNear) {
    ctx.strokeStyle = Math.floor(snap.tick / 8) % 2 ? "#ff1744" : "#aa00ff";
    ctx.lineWidth = highContrast ? 8 : 5;
    ctx.strokeRect(2, 2, w - 4, h - 4);
    alertBanner(w, "⚠ THỦY QUÁI ĐẾN GẦN! (Nanh vuốt Cá Sấu)", "rgba(183,28,28,.92)", "#ff5252", "#ffffff", alertY);
    alertY += 34;
  }
  if (oxyLow) {
    alertBanner(w, "⚠ OXY SẮP HẾT (< 20%)! Nổi lên mặt nước ngay!", "rgba(213,0,0,.92)", "#ffe600", "#ffffff", alertY);
  }

  
  // HP bar: Live mode uses 600 ticks per HP; headless contract stays unchanged.
  // Display decreases only while oxygen is zero and the player is underwater.
  if (p && p.hp_max) {
    const liveInterval = Number(
      snap.live_choke_interval_ticks ??
      snap.meta?.choke_interval_ticks ??
      60
    );
    const chokeInterval = Number.isFinite(liveInterval) && liveInterval > 0
      ? liveInterval : 60;
    const actualHP = Math.max(0, Number(p.hp));
    const maxHP = Number(p.hp_max);
    const zeroOxyTicks = Math.max(0, Number(p.zero_oxy_ticks || 0));
    const isChoking = p.oxygen_ticks === 0 && !p.at_surface && actualHP > 0;

    // Predict fractional loss within the current HP interval.
    // At each choke event, HP decreases by 1 and the timer resets to 0,
    // so the bar stays continuous across 67% and 33%.
    const visualHP = isChoking
      ? Math.max(0, actualHP - zeroOxyTicks / chokeInterval)
      : actualHP;
    const hpFraction = Math.max(0, Math.min(1, visualHP / maxHP));
    const hpPercent = Math.ceil(hpFraction * 100);

    bar(
      345, 12, 280, 18,
      hpFraction,
      hpPercent <= 30 ? "#ef5350" : "#ff6b81",
      `HP: ${hpPercent}%`
    );
  }

  // STAMINA LIVE ONLY: bottom of top HUD, separate from Oxygen + HP.
  if (snap.live_stamina) {
    const st = snap.live_stamina;
    const fraction = Math.max(0, Math.min(1, st.value / st.max));
    bar(650, 12, 220, 18, fraction,
      st.exhausted ? "#f59e0b" : "#4ade80",
      `Stamina ${Math.ceil(fraction * 100)}%${st.sprinting ? "  ⚡" : ""}`);
  }

  if (p && p.pos) text(`x ${p.pos[0].toFixed(1)}  d ${p.pos[1].toFixed(1)}`, 14, 52, { size: 12, color: "#9fb3c0" });
  if (p && p.oxygen_ticks === 0 && !p.at_surface) text("Hết hơi!", w / 2, 95, { size: 20, align: "center", color: "#ff5252" });
  if (p && p.at_surface) {
    const nearDock = meta.dock_pos && Math.hypot(p.pos[0] - meta.dock_pos[0], p.pos[1] - meta.dock_pos[1]) <= meta.dock_radius;
    const nearNode = (snap.nodes || []).some((n) => n.ready && Math.hypot(p.pos[0] - n.pos[0], p.pos[1] - n.pos[1]) <= meta.interact_radius);
    if (nearDock || nearNode) text(nearDock ? "E: cập bến" : "E: hái rau", w / 2, 120, { size: 18, align: "center" });
  }
  if (snap.day_plan) {
    const have = {}; (snap.hold || []).forEach((item) => { const kind = item.kind || item; have[kind] = (have[kind] || 0) + 1; });
    const target = Object.entries(snap.day_plan.ingredients).map(([kind, count]) =>
      `${KIND_NAME[kind] || kind} ${have[kind] || 0}/${count}`).join(" · ");
    text(`Ngày ${snap.day}: ${target}`, 14, 76, { size: 18 });
  }
  if (p && p.catch_cd_ticks > 0) text("hồi chiêu bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 150, 52, { size: 12, color: "#9fb3c0" });
  // giỏ (khoang) dưới
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(30, (w - 260) / cap - 4), y0 = h - bottom + 8;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      if (snap.hold[i]) { const item = snap.hold[i]; ctx.fillStyle = kc(item.kind || item); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6); }
    }
    const names = {}; snap.hold.forEach((item) => { const k = item.kind || item; names[k] = (names[k] || 0) + 1; });
    text("Giỏ " + snap.hold.length + "/" + cap + "  " + Object.keys(names).map((k) => (KIND_NAME[k] || k) + "×" + names[k]).join(", "), 14, y0 + sz + 16, { size: 12, color: "#cfd8dc" });
    const spoiled = snap.hold.filter((item) => typeof item === "object" && item.fresh < (meta.freshness?.spoiled_below ?? 30)).length;
    if (spoiled) text(`Hàng ươn: ${spoiled}`, 14, y0 - 6, { size: 14, color: "#ff5252" });
  }
  text("WASD bơi · Shift Sprint · E hái/cập bến · Space bắt cá · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 64, bottom = 40;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  // Sàn gỗ nhà bè trên sông đêm + đèn dây vàng (dùng nền vẽ tay nếu có)
  ctx.fillStyle = highContrast ? "#000000" : "#0b1a26"; ctx.fillRect(0, top, w, h - top);
  if (!highContrast && SPRITES.quan_bg) {
    ctx.drawImage(SPRITES.quan_bg, sx(0), sy(Z), X * s, Z * s);
  } else {
    ctx.fillStyle = highContrast ? "#111111" : "#9c7244"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  }
  ctx.strokeStyle = highContrast ? "#ffe600" : "#5a381e"; ctx.lineWidth = 5; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // Đèn dây vàng ấm dọc 2 mép nhà bè (nhẹ nhàng, không che bàn)
  for (let lx = 1.5; lx < X; lx += 3) {
    for (const lz of [0.22, Z - 0.22]) {
      if (!highContrast) {
        ctx.fillStyle = "rgba(255,215,80,.14)";
        ctx.beginPath(); ctx.arc(sx(lx), sy(lz), 0.45 * s, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = "#ffe066";
      ctx.beginPath(); ctx.arc(sx(lx), sy(lz), 0.11 * s, 0, Math.PI * 2); ctx.fill();
    }
  }
  // bếp than hồng + khói bếp
  (snap.stoves || []).forEach((st) => {
    const bx = sx(st.pos[0]), by = sy(st.pos[1]);
    ctx.fillStyle = "#3e2723"; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx - 0.85 * s, by - 0.85 * s, 1.7 * s, 1.7 * s, 8) : ctx.rect(bx - 0.85 * s, by - 0.85 * s, 1.7 * s, 1.7 * s); ctx.fill();
    ctx.strokeStyle = highContrast ? "#ffffff" : "#8d6e63"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = st.state === "cooking" ? "#ff6d00" : st.state === "ready" ? "#66bb6a" : "#616161";
    ctx.beginPath(); ctx.arc(bx, by, 0.52 * s, 0, Math.PI * 2); ctx.fill();
    if (st.state === "cooking" || st.state === "ready") {
      const puff = ((snap.tick || 0) % 40) / 40;
      ctx.fillStyle = `rgba(255,255,255,${0.45 * (1 - puff)})`;
      ctx.beginPath(); ctx.arc(bx + Math.sin(puff * 4) * 0.2 * s, by - (0.7 + puff * 0.9) * s, (0.18 + puff * 0.22) * s, 0, Math.PI * 2); ctx.fill();
    }
    text(st.id, bx, by + 4, { size: 12, align: "center", color: "#fff" });
    if (st.dish) {
      const dId = typeof st.dish === "string" ? st.dish : (st.dish.dish_id || "món");
      text(dn(dId), bx, by - 1.05 * s, { size: 11, align: "center", color: highContrast ? "#ffe600" : "#fff8e1" });
    }
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) text(Math.ceil(st.cook_ticks_left / 60) + "s", bx, by + 1.3 * s, { size: 11, align: "center", color: "#ffe082" });
  });
  // bàn gỗ tròn + khăn tre + tô thức ăn + khách đội nón lá + cảnh báo khách sắp giận
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  let angryCustomer = false;
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    const tx = sx(tb.pos[0]), ty = sy(tb.pos[1]);
    ctx.fillStyle = "#5c3818"; ctx.beginPath(); ctx.arc(tx, ty, 0.88 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = highContrast ? "#ffffff" : "#8d6e63"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#d7b889"; ctx.beginPath(); ctx.arc(tx, ty, 0.62 * s, 0, Math.PI * 2); ctx.fill();
    const c = byTable[tb.id];
    if (c && c.state === "eating") {
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(tx, ty, 0.34 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ef6c00"; ctx.beginPath(); ctx.arc(tx, ty, 0.24 * s, 0, Math.PI * 2); ctx.fill();
    } else {
      text(tb.id, tx, ty + 4, { size: 12, align: "center", color: "#4e342e" });
    }
    if (c) {
      const cx = tx, cy = ty - 1.45 * s;
      const patFrac = c.patience_ticks_left !== undefined ? c.patience_ticks_left / patMax : 1;
      const isAngry = c.state !== "eating" && patFrac < 0.25;
      if (isAngry) angryCustomer = true;
      if (SPRITES.customer_quan) {
        ctx.drawImage(SPRITES.customer_quan, cx - 0.72 * s, cy - 0.72 * s, 1.44 * s, 1.44 * s);
      } else {
        ctx.fillStyle = c.state === "eating" ? "#66bb6a" : (isAngry ? "#ff1744" : "#f48fb1");
        ctx.beginPath(); ctx.arc(cx, cy, 0.52 * s, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#f5d796"; ctx.beginPath(); ctx.arc(cx, cy - 0.08 * s, 0.38 * s, 0, Math.PI * 2); ctx.fill();
      }
      if (isAngry) { ctx.strokeStyle = "#ff1744"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, 0.78 * s, 0, Math.PI * 2); ctx.stroke(); }
      if (highContrast) { ctx.strokeStyle = isAngry ? "#ffe600" : "#ffffff"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.stroke(); }
      const dLabel = dn(c.dish_id || "?");
      text((isAngry ? "😠 " : "") + dLabel, cx, cy - 0.85 * s, { size: 11, align: "center", color: isAngry ? "#ff5252" : (highContrast ? "#ffe600" : "#fff8e1") });
      if (isAngry) text("Khách sắp bỏ về!", cx, cy - 1.65 * s, { size: 11, align: "center", color: highContrast ? "#ffe600" : "#ff5252" });
      if (c.patience_ticks_left !== undefined) bar(cx - 0.8 * s, cy + 0.65 * s, 1.6 * s, 5, patFrac, isAngry ? "#ff1744" : "#e57373");
    }
  });
  if (angryCustomer) {
    alertBanner(w, "⚠ 😠 KHÁCH SẮP BỎ VỀ! Phục vụ gấp!", "rgba(183,28,28,.92)", "#ffe600", "#ffffff", 62);
  }
  // người chơi (nhân viên Út Sen bưng khay)
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = highContrast ? "#ffe600" : "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    if (SPRITES.ut_sen_quan) {
      ctx.drawImage(SPRITES.ut_sen_quan, px - 0.85 * s, py - 0.85 * s, 1.7 * s, 1.7 * s);
    } else {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    }
    if (highContrast) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(px, py, 0.9 * s, 0, Math.PI * 2); ctx.stroke(); }
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      text("🍲 " + hand, px, py - 1.0 * s, { size: 11, align: "center", color: "#ffe082" });
    }
  }
  // HUD
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  text(`Tiền ${snap.money ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`, 110, 28, { size: 16 });
  const available = {};
  if (Array.isArray(snap.stock)) {
    const reserved = new Set((snap.customers || []).flatMap((c) => Array.isArray(c.reserved) ? c.reserved : []));
    snap.stock.filter((it) => !reserved.has(it.id) && it.fresh >= (meta.freshness?.spoiled_below ?? 30)).forEach((it) => { available[it.kind] = (available[it.kind] || 0) + 1; });
  } else {
    Object.assign(available, snap.stock || {});
    (snap.customers || []).forEach((c) => {
      if (c.reserved && !Array.isArray(c.reserved)) Object.entries(c.reserved).forEach(([kind, n]) => {
        available[kind] = Math.max(0, (available[kind] || 0) - n);
      });
    });
  }
  const stock = Object.keys(available).filter((k) => available[k] > 0).map((k) => (KIND_NAME[k] || k) + "×" + available[k]).join(", ");
  text("Kho khả dụng: " + (stock || "(trống)"), 14, 52, { size: 18, color: "#cfd8dc" });
  const spoiled = Array.isArray(snap.stock) ? snap.stock.filter((it) => it.fresh < (meta.freshness?.spoiled_below ?? 30)).length : 0;
  if (spoiled) text(`Hàng ươn: ${spoiled}`, 14, 73, { size: 14, color: "#ff5252" });
  text("WASD/mũi tên đi · E tương tác (bếp / bàn) · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

function drawShop(w, h) {
  text(`Ngày ${snap.day} — Cửa hàng`, w / 2, h / 2 - 115, { size: 28, align: "center" });
  text(`Tiền: ${snap.money}k · Uy tín: ${snap.reputation.toFixed(1)} · ${fmtTime(snap.time_left_ticks)}`,
       w / 2, h / 2 - 70, { size: 20, align: "center" });
  for (const [i, name] of ["oxygen", "hp"].entries()) {
    const next = (snap.shop_catalog[name] || []).find((item) => item.level === (snap.upgrades[name] || 0) + 1);
    const label = name === "oxygen" ? "Bình oxy" : "Áo phao";
    text(`${i + 1}: ${label} — ${next ? next.price + "k (cấp " + next.level + ")" : "đã tối đa"}`,
         w / 2, h / 2 - 20 + i * 42, { size: 20, align: "center" });
  }
  text("Nhấn 1 hoặc 2 để mua · Enter để đóng cửa hàng", w / 2, h / 2 + 90, { size: 18, align: "center" });
}

function dayScreen(w, h) {
  const screen = snap.ui_screen;
  if (!screen) return;
  ctx.fillStyle = "rgba(0,0,0,.88)"; ctx.fillRect(0, 0, w, h);
  if (screen === "menu") {
    text("Quán Ăn Chợ Nổi", w / 2, h / 2 - 65, { size: 32, align: "center" });
    text("E: Chơi · Q: Thoát", w / 2, h / 2, { size: 22, align: "center" });
  } else if (screen === "exited") {
    text("Đã thoát — nhấn R để trở về menu", w / 2, h / 2, { size: 22, align: "center" });
  } else if (screen === "day_intro") {
    text(`Ngày ${snap.day} — Má Tư cần`, w / 2, h / 2 - 95, { size: 26, align: "center" });
    Object.entries(snap.day_plan.ingredients).forEach(([kind, n], i) =>
      text(`${KIND_NAME[kind] || kind}: ${n}`, w / 2, h / 2 - 55 + 25 * i, { size: 19, align: "center" }));
    text("E: tiếp tục", w / 2, h - 40, { size: 18, align: "center" });
  } else if (screen === "evening_intro") {
    text("Nguyên liệu đưa về quán", w / 2, h / 2 - 65, { size: 26, align: "center" });
    const counts = {}; (Array.isArray(snap.stock) ? snap.stock : []).forEach((item) => { if (item.fresh >= (snap.meta?.freshness?.spoiled_below ?? 30)) counts[item.kind] = (counts[item.kind] || 0) + 1; });
    if (!Array.isArray(snap.stock)) Object.assign(counts, snap.stock || {});
    const stock = Object.entries(counts).map(([kind, n]) => `${KIND_NAME[kind] || kind}: ${n}`).join(" · ");
    text(stock || "Kho trống", w / 2, h / 2 - 20, { size: 20, align: "center" });
    const cookable = Object.keys(snap.day_plan.dishes).filter((name) =>
      Object.entries(snap.menu_recipes[name] || {}).every(([kind, amount]) => (counts[kind] || 0) >= amount));
    text(`Nấu được: ${cookable.join(", ") || "chưa có"}`, w / 2, h / 2 + 15, { size: 18, align: "center" });
    text("E: tiếp tục", w / 2, h / 2 + 55, { size: 18, align: "center" });
  } else if (screen === "day_result") {
    text(`Kết quả ngày ${snap.day}`, w / 2, h / 2 - 70, { size: 26, align: "center" });
    text(`Đã phục vụ: ${snap.day_stats.served} · Rời quán: ${snap.day_stats.left} · Boa: ${snap.day_stats.tips}k`,
         w / 2, h / 2 - 20, { size: 20, align: "center" });
    text(`Tiền: ${snap.money}k · Uy tín: ${snap.reputation.toFixed(1)} (${snap.day_stats.reputation_delta >= 0 ? "+" : ""}${snap.day_stats.reputation_delta})`, w / 2, h / 2 + 20, { size: 20, align: "center" });
    text("E: đến cửa hàng", w / 2, h / 2 + 65, { size: 18, align: "center" });
  }
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = highContrast ? "#000000" : "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    const phase = snap.mode === "day" ? snap.phase : snap.mode;
    if (phase === "quan") drawQuan(w, h); else if (phase === "shop") drawShop(w, h); else drawGather(w, h);
    overlay(w, h);
    if (snap.mode === "day") dayScreen(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
